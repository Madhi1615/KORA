name: Debug Fetch

# Temporary diagnostic. Safe to delete once the issue is diagnosed.
on:
  workflow_dispatch:

jobs:
  inspect-secret:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.KORA_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.KORA_SUPABASE_ANON_KEY }}
    steps:
      - name: Characterize KORA_SUPABASE_URL without printing it
        run: |
          echo "length: ${#SUPABASE_URL}"
          echo "starts_with_https: $([[ "$SUPABASE_URL" == https://* ]] && echo yes || echo no)"
          echo "has_leading_whitespace: $([[ "$SUPABASE_URL" =~ ^[[:space:]] ]] && echo yes || echo no)"
          echo "has_trailing_whitespace: $([[ "$SUPABASE_URL" =~ [[:space:]]$ ]] && echo yes || echo no)"
          echo "has_quote_char: $([[ "$SUPABASE_URL" == *\"* || "$SUPABASE_URL" == *\'* ]] && echo yes || echo no)"
          echo "has_internal_whitespace: $([[ "$SUPABASE_URL" =~ [[:space:]] ]] && echo yes || echo no)"
          echo "has_newline: $(printf '%s' "$SUPABASE_URL" | wc -l)"
          echo "trailing_slash: $([[ "$SUPABASE_URL" == */ ]] && echo yes || echo no)"
          echo "first_char_code: $(printf '%s' "$SUPABASE_URL" | head -c1 | od -An -tu1 | tr -d ' ')"
          echo "last_char_code: $(printf '%s' "$SUPABASE_URL" | tail -c1 | od -An -tu1 | tr -d ' ')"
          node -e "try { new URL(process.env.SUPABASE_URL); console.log('new URL() succeeds') } catch(e) { console.log('new URL() FAILS:', e.message) }"
          echo "---"
          echo "anon_key_length: ${#SUPABASE_ANON_KEY}"
          echo "anon_key_has_whitespace: $([[ "$SUPABASE_ANON_KEY" =~ [[:space:]] ]] && echo yes || echo no)"
